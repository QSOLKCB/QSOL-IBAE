[package]
name = "ibae-runtime"
version = "0.3.0-alpha.0"
edition = "2021"
rust-version = "1.74"
description = "Exact deterministic execution runtime for QSOL-IBAE"
license-file = "LICENSE"
publish = false

[lib]
name = "_runtime"
crate-type = ["cdylib", "rlib"]

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = "0.21.2"
ryu = "1.0.18"
serde_json = { version = "1.0.117", features = ["arbitrary_precision"] }
sha2 = "0.10.8"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true

[lints.rust]
unsafe_code = "forbid"
