name: PR6 round6 verified repair

on:
  push:
    branches: [repair/pr6-round6]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair tooling
        uses: actions/checkout@v4
        with:
          ref: repair/pr6-round6
          path: repair
      - name: Checkout exact PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/v0.5-progress-bounded-continuation
          path: repo
      - name: Require expected clean base
        run: |
          test "$(git -C repo rev-parse HEAD)" = "763ae1a08af0531bb44d19522ce801149140417c"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.74.1 --profile minimal --component clippy,rustfmt
          rustup default 1.74.1
      - name: Apply two new Codex fixes
        run: python repair/tools/pr6_round6_fix.py repo
      - name: Install patched package
        working-directory: repo
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Regenerate v0.5 reference fixture
        working-directory: repo
        run: python tools/render_v0_5_fixture.py > fixtures/v0.5/progress-continuation-reference.json
      - name: Rust format
        working-directory: repo
        run: cargo fmt --manifest-path rust/Cargo.toml --check
      - name: Rust check
        working-directory: repo
        run: cargo check --manifest-path rust/Cargo.toml --locked
      - name: Rust Clippy
        working-directory: repo
        run: cargo clippy --manifest-path rust/Cargo.toml --all-targets --locked -- -D warnings
      - name: Rust tests
        working-directory: repo
        run: cargo test --manifest-path rust/Cargo.toml --locked
      - name: Python tests
        working-directory: repo
        run: pytest
      - name: Verify deterministic fixtures under both hash seeds
        working-directory: repo
        run: |
          for seed in 1 8675309; do
            PYTHONHASHSEED=$seed python tools/render_v0_2_fixture.py > /tmp/v0.2-$seed.json
            cmp fixtures/v0.2/orchestration-reference.json /tmp/v0.2-$seed.json
            PYTHONHASHSEED=$seed python tools/render_v0_3_fixture.py > /tmp/v0.3-$seed.json
            cmp fixtures/v0.3/runtime-reference.json /tmp/v0.3-$seed.json
            PYTHONHASHSEED=$seed python tools/render_v0_4_fixture.py > /tmp/v0.4-$seed.json
            cmp fixtures/v0.4/governance-evidence-reference.json /tmp/v0.4-$seed.json
            PYTHONHASHSEED=$seed python tools/stress_compact_evidence.py > /tmp/stress-$seed.json
            cmp fixtures/v0.4/compact-evidence-stress.json /tmp/stress-$seed.json
            PYTHONHASHSEED=$seed python tools/render_v0_5_fixture.py > /tmp/v0.5-$seed.json
            cmp fixtures/v0.5/progress-continuation-reference.json /tmp/v0.5-$seed.json
            PYTHONHASHSEED=$seed python tools/render_budget_profile_benchmark.py > /tmp/bench-$seed.json
            cmp fixtures/v0.5/budget-profile-benchmark.json /tmp/bench-$seed.json
          done
      - name: Basic benchmark smoke
        working-directory: repo
        run: python benchmarks/basic.py
      - name: Fresh wheel build and isolated install
        working-directory: repo
        run: |
          rm -rf /tmp/qsol-wheel /tmp/qsol-install
          python -m pip wheel . --no-deps --wheel-dir /tmp/qsol-wheel
          python -m venv /tmp/qsol-install
          /tmp/qsol-install/bin/python -m pip install /tmp/qsol-wheel/*.whl
          cd /tmp
          /tmp/qsol-install/bin/python - <<'PY'
          import importlib.metadata
          import ibae
          from ibae.conformance import v0_4_reference_fixture, v0_5_budget_benchmark_fixture, v0_5_reference_fixture
          assert importlib.metadata.version('qsol-ibae') == '0.5.0a0'
          assert ibae.CONTINUATION_PROTOCOL_VERSION == 'IBAE-CONTINUATION-LEASE-V1'
          assert v0_4_reference_fixture()['finalization']['acceptance']['status'] == 'accepted'
          assert v0_5_reference_fixture()['partial_finalization']['record']['status'] == 'partial'
          assert v0_5_budget_benchmark_fixture()['correctness_authority'] is False
          PY
      - name: Commit verified source only
        working-directory: repo
        run: |
          git config user.name 'Trent Slade'
          git config user.email '73952179+EmergentMonk@users.noreply.github.com'
          git add src/ibae/continuation.py rust/src/lib.rs tests/test_continuation.py fixtures/v0.5/progress-continuation-reference.json CONTINUATION_PROTOCOL.md CHANGELOG.md
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'fix: close observer and request-cap continuation gaps'
          git push origin HEAD:feat/v0.5-progress-bounded-continuation
