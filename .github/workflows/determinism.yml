name: Determinism

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  byte-repeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.74.1 --profile minimal
          rustup default 1.74.1
      - run: python -m pip install -e .
      - name: Run benchmark twice
        run: |
          python benchmarks/basic.py > /tmp/run-a.json
          python benchmarks/basic.py > /tmp/run-b.json
          cmp /tmp/run-a.json /tmp/run-b.json
          cat /tmp/run-a.json
      - name: Repeat v0.2 orchestration across hash seeds
        run: |
          PYTHONHASHSEED=1 python tools/render_v0_2_fixture.py > /tmp/orchestration-a.json
          PYTHONHASHSEED=8675309 python tools/render_v0_2_fixture.py > /tmp/orchestration-b.json
          cmp /tmp/orchestration-a.json /tmp/orchestration-b.json
          cmp fixtures/v0.2/orchestration-reference.json /tmp/orchestration-a.json
      - name: Repeat v0.3 runtime fixture across hash seeds
        run: |
          PYTHONHASHSEED=1 python tools/render_v0_3_fixture.py > /tmp/runtime-a.json
          PYTHONHASHSEED=8675309 python tools/render_v0_3_fixture.py > /tmp/runtime-b.json
          cmp /tmp/runtime-a.json /tmp/runtime-b.json
          cmp fixtures/v0.3/runtime-reference.json /tmp/runtime-a.json
      - name: Repeat v0.4 governance/evidence fixture across hash seeds
        run: |
          PYTHONHASHSEED=1 python tools/render_v0_4_fixture.py > /tmp/governance-evidence-a.json
          PYTHONHASHSEED=8675309 python tools/render_v0_4_fixture.py > /tmp/governance-evidence-b.json
          cmp /tmp/governance-evidence-a.json /tmp/governance-evidence-b.json
          cmp fixtures/v0.4/governance-evidence-reference.json /tmp/governance-evidence-a.json
      - name: Repeat compact-evidence stress across hash seeds
        run: |
          PYTHONHASHSEED=1 python tools/stress_compact_evidence.py > /tmp/evidence-stress-a.json
          PYTHONHASHSEED=8675309 python tools/stress_compact_evidence.py > /tmp/evidence-stress-b.json
          cmp /tmp/evidence-stress-a.json /tmp/evidence-stress-b.json
          cmp fixtures/v0.4/compact-evidence-stress.json /tmp/evidence-stress-a.json
      - name: Repeat v0.5 progress/continuation across hash seeds
        run: |
          PYTHONHASHSEED=1 python tools/render_v0_5_fixture.py > /tmp/progress-continuation-a.json
          PYTHONHASHSEED=8675309 python tools/render_v0_5_fixture.py > /tmp/progress-continuation-b.json
          cmp /tmp/progress-continuation-a.json /tmp/progress-continuation-b.json
          cmp fixtures/v0.5/progress-continuation-reference.json /tmp/progress-continuation-a.json
      - name: Repeat v0.5 budget-profile benchmark across hash seeds
        run: |
          PYTHONHASHSEED=1 python tools/render_budget_profile_benchmark.py > /tmp/budget-profile-a.json
          PYTHONHASHSEED=8675309 python tools/render_budget_profile_benchmark.py > /tmp/budget-profile-b.json
          cmp /tmp/budget-profile-a.json /tmp/budget-profile-b.json
          cmp fixtures/v0.5/budget-profile-benchmark.json /tmp/budget-profile-a.json
