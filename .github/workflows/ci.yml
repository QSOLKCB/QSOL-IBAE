name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest
      - name: Verify v0.2 orchestration conformance fixture
        run: |
          python tools/render_v0_2_fixture.py > /tmp/v0.2-orchestration.json
          cmp fixtures/v0.2/orchestration-reference.json /tmp/v0.2-orchestration.json
      - run: python benchmarks/basic.py
