name: CI

on:
  push:
    branches: [feat/v0.5-progress-bounded-continuation]

permissions:
  contents: write

jobs:
  source-repair:
    if: github.event.head_commit.message == 'chore: prepare source-only PR6 repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.74.1 --profile minimal --component rustfmt
          rustup default 1.74.1
      - name: Apply the already-verified patch
        run: python tools/pr6_round3_fix.py
      - name: Build the extension required by fixture renderers
        run: python -m pip install -e .
      - name: Regenerate only v0.5 fixtures
        run: |
          PYTHONHASHSEED=1 python tools/render_v0_5_fixture.py > fixtures/v0.5/progress-continuation-reference.json
          PYTHONHASHSEED=1 python tools/render_budget_profile_benchmark.py > fixtures/v0.5/budget-profile-benchmark.json
          sha256sum fixtures/v0.5/progress-continuation-reference.json fixtures/v0.5/budget-profile-benchmark.json
      - name: Apply canonical Rust formatting
        run: cargo fmt --manifest-path rust/Cargo.toml
      - name: Commit only verified source artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/ibae/continuation.py \
            src/ibae/continuation_benchmark.py \
            rust/src/lib.rs \
            tests/test_continuation.py \
            fixtures/v0.5/progress-continuation-reference.json \
            fixtures/v0.5/budget-profile-benchmark.json
          git diff --cached --check
          git commit -m 'fix: harden continuation terminal and strategy boundaries'
          git push origin HEAD:feat/v0.5-progress-bounded-continuation
