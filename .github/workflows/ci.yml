name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.74.1 --profile minimal --component clippy,rustfmt
          rustup default 1.74.1
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,openai]'
      - name: Rust format
        run: cargo fmt --manifest-path rust/Cargo.toml --check
      - name: Rust check
        run: cargo check --manifest-path rust/Cargo.toml --locked
      - name: Rust Clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --all-targets --locked -- -D warnings
      - name: Rust tests
        run: cargo test --manifest-path rust/Cargo.toml --locked
      - name: Python tests
        run: pytest
      - name: Verify v0.2 orchestration conformance fixture
        run: |
          python tools/render_v0_2_fixture.py > /tmp/v0.2-orchestration.json
          cmp fixtures/v0.2/orchestration-reference.json /tmp/v0.2-orchestration.json
      - name: Verify v0.3 Python/Rust conformance fixture
        run: |
          python tools/render_v0_3_fixture.py > /tmp/v0.3-runtime.json
          cmp fixtures/v0.3/runtime-reference.json /tmp/v0.3-runtime.json
      - name: Verify v0.4 governance/evidence conformance fixture
        run: |
          python tools/render_v0_4_fixture.py > /tmp/v0.4-governance-evidence.json
          cmp fixtures/v0.4/governance-evidence-reference.json /tmp/v0.4-governance-evidence.json
      - name: Verify compact-evidence bounded stress fixture
        run: |
          python tools/stress_compact_evidence.py > /tmp/v0.4-compact-evidence-stress.json
          cmp fixtures/v0.4/compact-evidence-stress.json /tmp/v0.4-compact-evidence-stress.json
      - name: Verify v0.5 progress/continuation conformance fixture
        run: |
          python tools/render_v0_5_fixture.py > /tmp/v0.5-progress-continuation.json
          cmp fixtures/v0.5/progress-continuation-reference.json /tmp/v0.5-progress-continuation.json
      - name: Verify v0.5 budget-profile benchmark fixture
        run: |
          python tools/render_budget_profile_benchmark.py > /tmp/v0.5-budget-profile-benchmark.json
          cmp fixtures/v0.5/budget-profile-benchmark.json /tmp/v0.5-budget-profile-benchmark.json
      - name: Verify v0.6A supervisor/recovery conformance fixture
        run: |
          python tools/render_v0_6a_fixture.py > /tmp/v0.6a-supervisor-recovery.json
          cmp fixtures/v0.6A/supervisor-recovery-reference.json /tmp/v0.6a-supervisor-recovery.json
      - run: python benchmarks/basic.py
      - name: Replay v0.6B golden normalized inputs
        run: |
          python tools/render_v0_6b_fixture.py --inputs-only > /tmp/v0.6b-inputs.json
          cmp fixtures/v0.6B/supervisor-transcripts.json /tmp/v0.6b-inputs.json
          python tools/render_v0_6b_fixture.py --input fixtures/v0.6B/supervisor-transcripts.json --verify fixtures/v0.6B/synthetic-recovery-reference.json > /tmp/v0.6b-synthetic-recovery.json
      - name: Verify v0.6C offline wire and native read-only equivalence
        run: |
          python tools/render_v0_6c_fixture.py > /tmp/v0.6c-openai-readonly.json
          cmp fixtures/v0.6C/openai-readonly-reference.json /tmp/v0.6c-openai-readonly.json
      - name: Build wheel from fresh source
        run: python -m pip wheel . --no-deps --wheel-dir /tmp/qsol-wheel
      - name: Verify fresh wheel install
        run: |
          python -m venv /tmp/qsol-install
          /tmp/qsol-install/bin/python -m pip install /tmp/qsol-wheel/*.whl
          cd /tmp
          /tmp/qsol-install/bin/python - <<'PY'
          import importlib.metadata

          import ibae
          from ibae.conformance import (
              v0_4_reference_fixture,
              v0_5_budget_benchmark_fixture,
              v0_5_reference_fixture,
          )

          assert importlib.metadata.version("qsol-ibae") == "0.6.0rc2"
          assert ibae.RUNTIME_PROTOCOL_VERSION == "IBAE-RUNTIME-PROTOCOL-V1"
          assert ibae.GOVERNANCE_PROTOCOL_VERSION == "IBAE-GOVERNANCE-PROTOCOL-V1"
          assert ibae.EVIDENCE_PROTOCOL_VERSION == "IBAE-COMPACT-EVIDENCE-V1"
          assert ibae.CONTINUATION_PROTOCOL_VERSION == "IBAE-CONTINUATION-LEASE-V1"
          assert ibae.PROGRESS_PROTOCOL_VERSION == "IBAE-OBJECTIVE-PROGRESS-V1"
          from ibae.supervisor_conformance import v0_6a_reference_fixture
          supervisor_fixture = v0_6a_reference_fixture()
          assert supervisor_fixture["fresh_session_equivalent"] is True
          assert supervisor_fixture["rejection_state_neutral"] is True
          assert supervisor_fixture["live_recovery_verified"] is False
          from ibae.synthetic_conformance import v0_6b_reference_fixture
          synthetic_fixture = v0_6b_reference_fixture()
          assert synthetic_fixture["offline_only"] is True
          assert synthetic_fixture["live_recovery_verified"] is False
          assert synthetic_fixture["external_effects_executed"] == 0
          from ibae.transport_conformance import v0_6c_reference_fixture
          transport_fixture = v0_6c_reference_fixture()
          assert transport_fixture["offline_only"] is True
          assert transport_fixture["live_verification"] is False
          assert transport_fixture["fixture_equivalence"]["equivalent"] is True
          assert transport_fixture["observed_snapshot_equivalence"]["native_consumption_equivalence"]["equivalent"] is True
          assert transport_fixture["observed_snapshot_equivalence"]["live_capture_verified"] is False
          assert transport_fixture["selected_capture_admission"]["http_dispatches"] == 0
          assert len(transport_fixture["selected_capture_admission"]["cases"]) == 6
          assert transport_fixture["simulated_activation"]["network_dispatches"] == 0
          assert transport_fixture["simulated_activation"]["production_gate_authority"] is False
          assert all(not stage["live_transport_observed"] for stage in transport_fixture["simulated_activation"]["stage_observations"])
          from ibae.effect_conformance import v0_6d_reference_fixture
          effect_fixture = v0_6d_reference_fixture()
          assert effect_fixture["scenario_count"] == 18
          assert effect_fixture["external_mutations"] == 0
          assert effect_fixture["live_effects_enabled"] is False
          assert effect_fixture["live_recovery_verified"] is False
          legacy_fixture = v0_4_reference_fixture()
          assert legacy_fixture["finalization"]["acceptance"]["status"] == "accepted"
          assert legacy_fixture["compact_evidence"]["source_bound"] is True
          continuation_fixture = v0_5_reference_fixture()
          assert continuation_fixture["lease_decisions"]["first_grant"]["status"] == "granted"
          assert continuation_fixture["partial_finalization"]["record"]["status"] == "partial"
          benchmark = v0_5_budget_benchmark_fixture()
          assert benchmark["benchmark_only"] is True
          assert benchmark["correctness_authority"] is False
          PY
      - name: Verify v0.6D native synthetic effect replay
        run: |
          python tools/render_v0_6d_fixture.py --inputs-only > /tmp/v0.6d-effect-inputs.json
          cmp fixtures/v0.6D/effect-inputs.json /tmp/v0.6d-effect-inputs.json
          python tools/render_v0_6d_fixture.py --input fixtures/v0.6D/effect-inputs.json --verify fixtures/v0.6D/governed-effects-reference.json > /tmp/v0.6d-governed-effects.json
      - name: Preserve generated lock and conformance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v0.6d-build-evidence
          if-no-files-found: warn
          path: |
            rust/Cargo.lock
            /tmp/v0.2-orchestration.json
            /tmp/v0.3-runtime.json
            /tmp/v0.4-governance-evidence.json
            /tmp/v0.4-compact-evidence-stress.json
            /tmp/v0.5-progress-continuation.json
            /tmp/v0.5-budget-profile-benchmark.json
            /tmp/v0.6a-supervisor-recovery.json
            /tmp/v0.6b-inputs.json
            /tmp/v0.6b-synthetic-recovery.json
            /tmp/v0.6c-openai-readonly.json
            /tmp/v0.6d-effect-inputs.json
            /tmp/v0.6d-governed-effects.json
            /tmp/qsol-wheel/*.whl
