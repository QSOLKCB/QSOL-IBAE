name: CI

on:
  push:
    branches: [feat/v0.5-progress-bounded-continuation]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.74.1 --profile minimal --component clippy,rustfmt
          rustup default 1.74.1
      - name: Apply exact-head review hardening
        run: python tools/pr6_round3_fix.py
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Regenerate v0.5 fixtures only
        run: |
          PYTHONHASHSEED=1 python tools/render_v0_5_fixture.py > fixtures/v0.5/progress-continuation-reference.json
          PYTHONHASHSEED=1 python tools/render_budget_profile_benchmark.py > fixtures/v0.5/budget-profile-benchmark.json
      - name: Rust format
        run: |
          cargo fmt --manifest-path rust/Cargo.toml
          cargo fmt --manifest-path rust/Cargo.toml --check
      - name: Rust check
        run: cargo check --manifest-path rust/Cargo.toml --locked
      - name: Rust Clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --all-targets --locked -- -D warnings
      - name: Rust tests
        run: cargo test --manifest-path rust/Cargo.toml --locked
      - name: Python tests
        run: pytest
      - name: Verify deterministic fixtures and frozen predecessors
        run: |
          python benchmarks/basic.py > /tmp/run-a.json
          python benchmarks/basic.py > /tmp/run-b.json
          cmp /tmp/run-a.json /tmp/run-b.json

          PYTHONHASHSEED=1 python tools/render_v0_2_fixture.py > /tmp/v02-a.json
          PYTHONHASHSEED=8675309 python tools/render_v0_2_fixture.py > /tmp/v02-b.json
          cmp /tmp/v02-a.json /tmp/v02-b.json
          cmp fixtures/v0.2/orchestration-reference.json /tmp/v02-a.json

          PYTHONHASHSEED=1 python tools/render_v0_3_fixture.py > /tmp/v03-a.json
          PYTHONHASHSEED=8675309 python tools/render_v0_3_fixture.py > /tmp/v03-b.json
          cmp /tmp/v03-a.json /tmp/v03-b.json
          cmp fixtures/v0.3/runtime-reference.json /tmp/v03-a.json

          PYTHONHASHSEED=1 python tools/render_v0_4_fixture.py > /tmp/v04-a.json
          PYTHONHASHSEED=8675309 python tools/render_v0_4_fixture.py > /tmp/v04-b.json
          cmp /tmp/v04-a.json /tmp/v04-b.json
          cmp fixtures/v0.4/governance-evidence-reference.json /tmp/v04-a.json

          PYTHONHASHSEED=1 python tools/stress_compact_evidence.py > /tmp/stress-a.json
          PYTHONHASHSEED=8675309 python tools/stress_compact_evidence.py > /tmp/stress-b.json
          cmp /tmp/stress-a.json /tmp/stress-b.json
          cmp fixtures/v0.4/compact-evidence-stress.json /tmp/stress-a.json

          PYTHONHASHSEED=1 python tools/render_v0_5_fixture.py > /tmp/v05-a.json
          PYTHONHASHSEED=8675309 python tools/render_v0_5_fixture.py > /tmp/v05-b.json
          cmp /tmp/v05-a.json /tmp/v05-b.json
          cmp fixtures/v0.5/progress-continuation-reference.json /tmp/v05-a.json

          PYTHONHASHSEED=1 python tools/render_budget_profile_benchmark.py > /tmp/budget-a.json
          PYTHONHASHSEED=8675309 python tools/render_budget_profile_benchmark.py > /tmp/budget-b.json
          cmp /tmp/budget-a.json /tmp/budget-b.json
          cmp fixtures/v0.5/budget-profile-benchmark.json /tmp/budget-a.json
      - name: Fresh wheel build and isolated install
        run: |
          python -m pip wheel . --no-deps --wheel-dir /tmp/qsol-wheel
          python -m venv /tmp/qsol-install
          /tmp/qsol-install/bin/python -m pip install /tmp/qsol-wheel/*.whl
          cd /tmp
          /tmp/qsol-install/bin/python - <<'PY'
          import importlib.metadata
          import ibae
          from ibae.conformance import v0_4_reference_fixture, v0_5_budget_benchmark_fixture, v0_5_reference_fixture

          assert importlib.metadata.version('qsol-ibae') == '0.5.0a0'
          assert ibae.CONTINUATION_PROTOCOL_VERSION == 'IBAE-CONTINUATION-LEASE-V1'
          assert v0_4_reference_fixture()['finalization']['acceptance']['status'] == 'accepted'
          assert v0_5_reference_fixture()['lease_decisions']['first_grant']['status'] == 'granted'
          assert v0_5_budget_benchmark_fixture()['benchmark_only'] is True
          PY
      - name: Commit only the verified repair
        run: |
          git show e5bcb9feaee5468938b7d32b15bd050d7b002990:.github/workflows/ci.yml > .github/workflows/ci.yml
          git rm tools/pr6_round3_fix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: harden continuation terminal and strategy boundaries'
          git push origin HEAD:feat/v0.5-progress-bounded-continuation
