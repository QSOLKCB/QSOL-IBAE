name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.74.1 --profile minimal --component clippy,rustfmt
          rustup default 1.74.1
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Rust format
        run: cargo fmt --manifest-path rust/Cargo.toml --check
      - name: Rust check
        run: cargo check --manifest-path rust/Cargo.toml --locked
      - name: Rust Clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --all-targets --locked -- -D warnings
      - name: Rust tests
        run: cargo test --manifest-path rust/Cargo.toml --locked
      - name: Python tests
        run: pytest
      - name: Verify v0.2 orchestration conformance fixture
        run: |
          python tools/render_v0_2_fixture.py > /tmp/v0.2-orchestration.json
          cmp fixtures/v0.2/orchestration-reference.json /tmp/v0.2-orchestration.json
      - name: Verify v0.3 Python/Rust conformance fixture
        run: |
          python tools/render_v0_3_fixture.py > /tmp/v0.3-runtime.json
          cmp fixtures/v0.3/runtime-reference.json /tmp/v0.3-runtime.json
      - name: Verify v0.4 governance/evidence conformance fixture
        run: |
          python tools/render_v0_4_fixture.py > /tmp/v0.4-governance-evidence.json
          cmp fixtures/v0.4/governance-evidence-reference.json /tmp/v0.4-governance-evidence.json
      - name: Verify compact-evidence bounded stress fixture
        run: |
          python tools/stress_compact_evidence.py > /tmp/v0.4-compact-evidence-stress.json
          cmp fixtures/v0.4/compact-evidence-stress.json /tmp/v0.4-compact-evidence-stress.json
      - run: python benchmarks/basic.py
      - name: Build wheel from fresh source
        run: python -m pip wheel . --no-deps --wheel-dir /tmp/qsol-wheel
      - name: Verify fresh wheel install
        run: |
          python -m venv /tmp/qsol-install
          /tmp/qsol-install/bin/python -m pip install /tmp/qsol-wheel/*.whl
          cd /tmp
          /tmp/qsol-install/bin/python - <<'PY'
          import importlib.metadata

          import ibae
          from ibae.conformance import v0_4_reference_fixture

          assert importlib.metadata.version("qsol-ibae") == "0.4.0a0"
          assert ibae.RUNTIME_PROTOCOL_VERSION == "IBAE-RUNTIME-PROTOCOL-V1"
          assert ibae.GOVERNANCE_PROTOCOL_VERSION == "IBAE-GOVERNANCE-PROTOCOL-V1"
          assert ibae.EVIDENCE_PROTOCOL_VERSION == "IBAE-COMPACT-EVIDENCE-V1"
          fixture = v0_4_reference_fixture()
          assert fixture["finalization"]["acceptance"]["status"] == "accepted"
          assert fixture["compact_evidence"]["source_bound"] is True
          PY
      - name: Preserve generated lock and conformance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v0.4-build-evidence
          if-no-files-found: warn
          path: |
            rust/Cargo.lock
            /tmp/v0.2-orchestration.json
            /tmp/v0.3-runtime.json
            /tmp/v0.4-governance-evidence.json
            /tmp/v0.4-compact-evidence-stress.json
            /tmp/qsol-wheel/*.whl
