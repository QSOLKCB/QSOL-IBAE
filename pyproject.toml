[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "qsol-ibae"
version = "0.5.0a0"
description = "Invariant-Bounded Agent Execution kernel"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "QSOL-IMC"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.maturin]
manifest-path = "rust/Cargo.toml"
module-name = "ibae._runtime"
python-source = "src"
features = ["extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
